services:
  php:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: php_CashHarbor
    volumes:
      - .:/var/www/html
    networks:
      - app_network
  nginx:
    image: nginx:stable-alpine3.24-perl
    container_name: nginx_CashHarbor
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      - php
    networks:
      - app_network
  db:
    image: mariadb:13.0.1-ubi10-rc
    container_name: db_CashHarbor
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
  