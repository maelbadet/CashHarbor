name: cashharbor
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Storage__Directory: /data
      Storage__KeyDirectory: /keys
      Security__PublicOrigin: ${CASHHARBOR_ORIGIN:?Set CASHHARBOR_ORIGIN in .env}
      Security__ProxyAddress: 172.30.88.1
      Security__KeyCertificatePath: /run/secrets/key_certificate
      Security__KeyCertificatePasswordFile: /run/secrets/key_certificate_password
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      TZ: Europe/Paris
      Markets__AlphaVantageKey: ${ALPHAVANTAGE_API_KEY:-}
      Markets__CoinGeckoKey: ${COINGECKO_API_KEY:-}
    volumes:
      - data:/data
      - keys:/keys
    secrets:
      - key_certificate
      - key_certificate_password
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    mem_limit: 512m
    cpus: 1.0
    networks:
      - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  key_certificate:
    file: ./.secrets/keys.pfx
  key_certificate_password:
    file: ./.secrets/keys-password
volumes:
  data:
    name: cashharbor_data
  keys:
    name: cashharbor_keys
networks:
  private:
    ipam:
      config:
        - subnet: 172.30.88.0/24
          gateway: 172.30.88.1
